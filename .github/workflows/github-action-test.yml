name: 呆呆的工作流1
run-name: ${{github.actor}} 执行了该工作流
on: [push]
jobs:
    daidaidejob:
        runs-on: ubuntu-latest
        steps:
            - name: echo一下
              run: echo '臭呆子喝水！'
            - name: echo两下
              run: echo "臭呆子偷喝我的水!"
    test-actions-helper:
      runs-on: ubuntu-latest
      steps:
        - id: test
          uses: 17kbz/actions-helper/test/TestAction
          with:
            input_test: '潘潘测试'
        - run: echo "$OUTPUT_TEST"
          shell: bash
          env:
            OUTPUT_TEST: ${{steps.test.outputs.output-test}}